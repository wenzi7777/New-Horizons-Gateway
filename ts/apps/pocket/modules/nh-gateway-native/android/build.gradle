plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.nhgatewaynative'
version = '0.1.0'

android {
  namespace "expo.modules.nhgatewaynative"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // FileProvider (in-app update: hands the downloaded APK to the installer).
  implementation "androidx.core:core-ktx:1.13.1"
}
