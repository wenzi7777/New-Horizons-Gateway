[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "newhorizons-gateway"
version = "1.1.2"
requires-python = ">=3.9"
dependencies = [
    "Flask==3.0.3",
    "websocket-client==1.8.0",
    "textual>=0.70,<1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["newhorizons_gateway*"]

# The WebUI is plain files beside the code (web.py serves them).
[tool.setuptools.package-data]
newhorizons_gateway = ["webui/*"]
