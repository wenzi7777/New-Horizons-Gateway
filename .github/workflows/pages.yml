name: pages

# Builds and deploys the NH Gateway download page (site/) to GitHub Pages:
# https://wenzi7777.github.io/New-Horizons-Gateway/
#
# One-time setup: Pages must be enabled in the repo settings with the
# workflow as its source (Settings -> Pages -> Build and deployment ->
# Source: GitHub Actions). Until then the deploy step fails.

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "brand/svg/**"
      - "ts/packages/ui-tokens/src/tokens.css"
      - "ts/packages/node/webui/theme.js"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push waits instead of cancelling a deploy
# that is already running.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test
        run: node --test 'site/test/*.test.mjs'
      - name: Build
        run: node site/build.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
